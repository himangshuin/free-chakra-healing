/* ---------- STATE ---------- */
let currentLang = "en";
const langLabel = document.getElementById("langLabel");
const appTitle = document.getElementById("appTitle");
const appSubtitle = document.getElementById("appSubtitle");
const waysHeading = document.getElementById("waysHeading");
const waysIntro = document.getElementById("waysIntro");
const waysList = document.getElementById("waysList");
const grid = document.getElementById("chakraGrid");
const overlay = document.getElementById("modalOverlay");
const modalContent = document.getElementById("modalContent");

/* ---------- RENDER ---------- */
function renderUI() {
  const L = UI[currentLang];
  appTitle.textContent = L.title;
  appSubtitle.textContent = L.subtitle;
  langLabel.textContent = L.langBtn;
  waysHeading.innerHTML = `<i class="fas fa-spa" style="color:#7f5fa8;"></i> ${L.waysHeading}`;
  waysIntro.textContent = L.waysIntro;
  waysList.innerHTML = L.ways.map((w, i) => {
    const icons = ["fa-brain","fa-comment-dots","fa-om","fa-apple-alt","fa-hand-sparkles"];
    return `<div class="way-pill"><i class="fas ${icons[i]}"></i> ${w}</div>`;
  }).join("");
}

function renderCards() {
  grid.innerHTML = "";
  const L = UI[currentLang].labels;

  chakras.forEach(ch => {
    const card = document.createElement("div");
    card.className = "chakra-card";
    card.dataset.id = ch.id;

    const badge = document.createElement("div");
    badge.className = "chakra-color-badge";
    badge.style.backgroundColor = ch.color;
    badge.textContent = "🕉️";
    if (ch.id === "crown" || ch.id === "solar") {
      badge.style.color = "#1e1129";
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "chakra-name";
    nameDiv.innerHTML = `${ch.name[currentLang]} <span class="chakra-sanskrit">${ch.sanskrit}</span>`;

    const meta = document.createElement("div");
    meta.className = "chakra-meta";
    meta.innerHTML = `
      <span><i class="fas fa-mountain"></i>${L.element}: ${ch.element[currentLang]}</span>
      <span><i class="fas fa-palette"></i>${L.color}: ${ch.colorName[currentLang]}</span>
      <span><i class="fas fa-map-pin"></i>${L.location}: ${ch.location[currentLang].split(",")[0]}</span>
    `;

    const firstLine = ch.affirmation[currentLang].split("/")[0].trim();
    const aff = document.createElement("div");
    aff.className = `chakra-affirmation border-${ch.id}`;
    aff.textContent = `“${firstLine}”`;

    const footer = document.createElement("div");
    footer.className = "card-footer";
    footer.innerHTML = `
      <span><i class="fas fa-gem"></i> ${ch.crystals.slice(0,2).join(", ")}</span>
      <span class="balanced-badge"><i class="fas fa-check-circle"></i> ${ch.balanced[currentLang][0]}</span>
    `;

    card.appendChild(badge);
    card.appendChild(nameDiv);
    card.appendChild(meta);
    card.appendChild(aff);
    card.appendChild(footer);
    card.addEventListener("click", () => openModal(ch));
    grid.appendChild(card);
  });
}

function openModal(ch) {
  const L = UI[currentLang].labels;
  const lang = currentLang;
  const accent = ch.color;
  const badgeTextColor = (ch.id === "crown" || ch.id === "solar") ? "#1e1129" : "white";

  const orgList = ch.organs[lang].map(o => `<li>${o}</li>`).join("");
  const mentalList = ch.mental[lang].map(m => `<li>${m}</li>`).join("");
  const diseaseList = ch.diseases[lang].map(d => `<li>${d}</li>`).join("");
  const balList = ch.balanced[lang].map(b => `<li>${b}</li>`).join("");
  const unbalList = ch.unbalanced[lang].map(u => `<li>${u}</li>`).join("");
  const crystalChips = ch.crystals.map(c => `<span class="chip">${c}</span>`).join("");

  // Affirmation: all 4 lines separated by "/"
  const affLines = ch.affirmation[lang].split("/").map(l => l.trim()).filter(Boolean);
  const affHtml = affLines.map(l => `• ${l}`).join("<br>");

  modalContent.innerHTML = `
    <button class="modal-close" id="modalCloseBtn"><i class="fas fa-times"></i></button>
    <div class="modal-header">
      <div class="modal-color-badge" style="background-color:${accent}; color:${badgeTextColor};">🕉️</div>
      <div class="modal-title">
        <h2>${ch.name[lang]} <span class="chakra-sanskrit">${ch.sanskrit}</span></h2>
        <p>${L.location}: ${ch.location[lang]} · ${L.element}: ${ch.element[lang]} · ${L.color}: ${ch.colorName[lang]}</p>
      </div>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-quote-left" style="color:${accent};"></i> ${L.affirmation}</h3>
      <div class="modal-affirmation" style="border-left-color:${accent};">${affHtml}</div>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-gem" style="color:${accent};"></i> ${L.crystals}</h3>
      <div class="chip-list">${crystalChips}</div>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-heartbeat" style="color:${accent};"></i> ${L.organs}</h3>
      <ul class="organ-list">${orgList}</ul>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-brain" style="color:${accent};"></i> ${L.mental}</h3>
      <ul class="mental-list">${mentalList}</ul>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-exclamation-triangle" style="color:${accent};"></i> ${L.disease}</h3>
      <ul class="disease-list">${diseaseList}</ul>
    </div>

    <div class="modal-section two-col-grid">
      <div>
        <h3><i class="fas fa-check-circle" style="color:#2e7d32;"></i> ${L.balanced}</h3>
        <ul class="balanced-list">${balList}</ul>
      </div>
      <div>
        <h3><i class="fas fa-times-circle" style="color:#b33b3b;"></i> ${L.unbalanced}</h3>
        <ul class="unbalanced-list">${unbalList}</ul>
      </div>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-pen" style="color:${accent};"></i> ${L.remarks}</h3>
      <p class="remarks-box">${ch.remarks[lang]}</p>
    </div>
  `;

  overlay.classList.add("active");
  document.body.style.overflow = "hidden";
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}

function closeModal() {
  overlay.classList.remove("active");
  document.body.style.overflow = "";
}

/* ---------- EVENTS ---------- */
document.getElementById("langToggle").addEventListener("click", () => {
  currentLang = currentLang === "en" ? "as" : "en";
  renderUI();
  renderCards();
  // if a modal is open, re-render it in the new language
  const openCard = [...document.querySelectorAll(".chakra-card")].find(c => c.dataset.id);
  if (overlay.classList.contains("active")) {
    // re-open the currently displayed chakra if we can identify it
    // simplest: close then nothing; but better, find which chakra via its name
    // We'll store last opened in a variable
    if (lastOpenChakra) openModal(lastOpenChakra);
  }
});

let lastOpenChakra = null;
// patch openModal to remember
const origOpen = openModal;
openModal = function(ch) {
  lastOpenChakra = ch;
  origOpen(ch);
};

overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.classList.contains("active")) closeModal();
});

/* ---------- INIT ---------- */
renderUI();
renderCards();
</script>
</body>
</html>
